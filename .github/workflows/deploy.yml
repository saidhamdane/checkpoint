name: Test and deploy Worker

on:
  push:
    branches: [main]
    paths: ["worker/**", ".github/workflows/deploy.yml"]
  pull_request:
    paths: ["worker/**"]
  workflow_dispatch:

concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npx tsc --noEmit
      - run: npm test

  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci --legacy-peer-deps

      - name: Check required secrets
        run: |
          missing=""
          for v in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID D1_DATABASE_ID TELEGRAM_CHAT_ID; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing (Settings > Secrets and variables > Actions)"
            exit 1
          fi

      - name: Build wrangler.toml from template
        run: |
          cp wrangler.example.toml wrangler.toml
          sed -i "s/REPLACE_WITH_ID_FROM_wrangler_d1_create/${D1_DATABASE_ID}/" wrangler.toml
          sed -i "s/^TELEGRAM_CHAT_ID = \".*\"/TELEGRAM_CHAT_ID = \"${TELEGRAM_CHAT_ID}\"/" wrangler.toml
          grep -q "$D1_DATABASE_ID" wrangler.toml

      - name: Apply schema (idempotent)
        run: npx wrangler d1 execute checkpoint-db --remote --file=schema.sql --yes

      - name: Deploy
        run: npx wrangler deploy

      - name: Smoke test
        run: |
          sleep 5
          code=$(curl -s -o /dev/null -w "%{http_code}" https://checkpoint.saidmatorral.workers.dev/health)
          echo "health: $code"
          [ "$code" = "200" ]
